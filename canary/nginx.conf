events {
    worker_connections 1024;
}

http {
    # Weighted upstream split between Blue (v1) and Green (v2) models
    upstream model_backend {
        # Stage 1 Default: 95% traffic to Blue, 5% traffic to Green
        server blue:8000 weight=95;
        server green:8000 weight=5;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://model_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /healthz {
            proxy_pass http://model_backend/healthz;
        }
    }
}
