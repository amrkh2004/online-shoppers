name: CI/CD Pipeline — Online Shoppers ML Service

on:
  push:
    branches: [ main, module-1-packaging, module-2-tracking-automation ]
  pull_request:
    branches: [ main, module-1-packaging ]

jobs:
  lint:
    name: 🎨 Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Black Formatter Check
        run: black --check .

  test:
    name: 🧪 Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Train & Export Model Artifacts
        run: |
          python scripts/prepare_data.py
          python scripts/train_model.py

      - name: Run Pytest Suite with Coverage
        run: pytest

  docker-build:
    name: 🐳 Docker Container Build & Verify
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Train & Export Model Artifacts
        run: |
          python scripts/prepare_data.py
          python scripts/train_model.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: online-shoppers-api:latest
