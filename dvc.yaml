stages:
  prepare:
    cmd: py scripts/prepare_data.py
    deps:
      - scripts/prepare_data.py
      - notebooks/online_shoppers_intention.csv
    params:
      - prepare.test_size
      - prepare.random_state
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: py scripts/train_model.py
    deps:
      - scripts/train_model.py
      - data/processed/train.csv
    params:
      - train.n_estimators
      - train.max_depth
      - train.min_samples_split
      - train.min_samples_leaf
      - train.random_state
    outs:
      - models/final_random_forest.pkl
      - models/scaler.pkl
      - models/feature_names.json

  evaluate:
    cmd: py scripts/evaluate.py
    deps:
      - scripts/evaluate.py
      - data/processed/test.csv
      - models/final_random_forest.pkl
    params:
      - evaluate.threshold
    metrics:
      - reports/metrics.json:
          cache: false
